name: Lay link M3U8

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL trang livestream
        required: true
        type: string
      quality:
        description: Chat luong Streamlink
        default: best
        type: string

permissions:
  contents: write

jobs:
  extract:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: update-result-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Extract playlist
        env:
          STREAM_URL: ${{ inputs.url }}
          STREAM_QUALITY: ${{ inputs.quality }}
        shell: bash
        run: |
          python get_m3u8.py --headless -- "$STREAM_URL" "$STREAM_QUALITY" > "$RUNNER_TEMP/playlist-url.txt"
          python - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit

          raw = (Path(os.environ["RUNNER_TEMP"]) / "playlist-url.txt").read_text().strip()
          url = urlsplit(raw)
          if url.scheme not in {"http", "https"} or not url.hostname or not url.path:
              raise SystemExit("No valid playlist URL")
          if url.username is not None or url.password is not None:
              raise SystemExit("Playlist URL contains credentials")
          Path("result.txt").write_text(urlunsplit((url.scheme, url.netloc, url.path, "", "")) + "\n")
          PY
      - name: Save result.txt to main
        shell: bash
        run: |
          test -s result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- result.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update result.txt"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload result.txt
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.txt
          if-no-files-found: error
