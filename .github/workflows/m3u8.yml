name: Lay link M3U8

on:
  workflow_dispatch:
    inputs:
      url:
        description: URL trang livestream
        required: true
        type: string
      quality:
        description: Chat luong Streamlink
        default: best
        type: string

permissions: {}

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Extract playlist
        env:
          STREAM_URL: ${{ inputs.url }}
          STREAM_QUALITY: ${{ inputs.quality }}
        run: python get_m3u8.py --headless -- "$STREAM_URL" "$STREAM_QUALITY"
